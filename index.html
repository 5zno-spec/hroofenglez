<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جمّول يعلّمني الإنجليزية</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3c9;--card:#ffffff;--ink:#3a2a1a;--sun:#ffb703;--sky:#4cc9f0;--grass:#4cb944;--coral:#ff6b6b;--shadow:#e0b84a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2440;--card:#3b3358;--ink:#fff4d6;--shadow:#1d1830;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.7rem;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.mascot{font-size:5rem;line-height:1;text-align:center}
.bubble{background:var(--card);border-radius:22px;padding:12px 18px;text-align:center;font-size:1.2rem;box-shadow:0 5px 0 var(--shadow)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.cat{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--shadow);font-size:1.5rem;font-weight:800;text-align:start}
.cat:active,.opt:active,.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.cat .ic{font-size:2.6rem}
.cat small{display:block;font-size:.95rem;font-weight:500;opacity:.75}
.stars{font-size:1.2rem;font-weight:800;background:var(--card);padding:4px 14px;border-radius:99px}
.btn{background:var(--sun);color:#3a2a1a;border-radius:99px;padding:10px 26px;font-size:1.3rem;font-weight:800;box-shadow:0 5px 0 #c98a00}
.back{background:var(--card);border-radius:99px;padding:6px 16px;font-weight:800;box-shadow:0 3px 0 var(--shadow)}
.word{display:flex;flex-direction:column;align-items:center;gap:6px}
.say{width:120px;height:120px;border-radius:50%;background:var(--sky);font-size:3.4rem;box-shadow:0 7px 0 #2a9cc2}
.say:active{transform:translateY(5px);box-shadow:0 2px 0 #2a9cc2}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{aspect-ratio:1;border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--shadow);font-size:4rem;display:flex;align-items:center;justify-content:center}
.opt .sw{width:64%;height:64%;border-radius:50%;border:4px solid rgba(0,0,0,.15)}
.opt .lt{font-weight:800;direction:ltr;font-size:3.4rem}
.opt.ok{background:#b6f2b0;animation:pop .5s}
.opt.no{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--shadow)}
.dots i.on{background:var(--grass)}
.big{font-size:2.6rem;font-weight:800;direction:ltr}
.center{text-align:center}
.pad{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:0 6px 0 var(--shadow);touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:28px;touch-action:none}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.board button{position:relative;display:flex;align-items:baseline;justify-content:center;gap:8px;height:88px;padding:22px 0 0;border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--shadow);direction:ltr}
.board button span{font-weight:800;color:var(--ink);line-height:1}
.board .up{font-size:3.4rem}
.cbox.up b{font-size:8rem}
.board .lo{font-size:1.6rem}
.cbox.lo b{font-size:3.6rem}
.cases{display:flex;gap:18px;align-items:flex-end;justify-content:center}
.cbox{text-align:center}
.cbox small{display:block;font-size:1rem;font-weight:800}
.cbox b{display:block;line-height:1.1;font-weight:800;direction:ltr}
.board button.done{outline:4px solid var(--grass);outline-offset:-2px}
.board button.done::after{content:'✓';position:absolute;top:3px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--grass);color:#fff;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.board button:active{transform:translateY(3px)}
.board button.now{outline:5px solid var(--coral);outline-offset:-2px;transform:scale(1.07)}
#bplay{align-self:center;width:76px;height:76px;padding:0;border-radius:50%;font-size:2.2rem;line-height:1;display:flex;align-items:center;justify-content:center}
.stbig{font-size:6.5rem;font-weight:800;direction:ltr;line-height:1.1}
.pb{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-100%);background:var(--card);color:var(--ink);border:3px solid var(--sun);border-radius:99px;padding:6px 18px;font-size:1.5rem;font-weight:800;box-shadow:0 4px 0 var(--shadow);white-space:nowrap;animation:rise 2.2s ease-out both}
@keyframes rise{0%{opacity:0;margin-top:24px;transform:translate(-50%,-100%) scale(.5)}15%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}80%{opacity:1}100%{opacity:0;margin-top:-80px;transform:translate(-50%,-100%) scale(1)}}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<!-- Home -->
<section id="home" class="hide" style="display:flex;flex-direction:column;gap:14px">
  <div class="top"><h1>جمّول يعلّمني</h1><span class="stars" id="total">⭐ 0</span></div>
  <div class="mascot">🐪</div>
  <div class="bubble">مرحبًا! أنا جمّول. هيا نبدأ بحروف الإنجليزية، ثم ننتقل إلى الكلمات.</div>
  <div id="cats" style="display:flex;flex-direction:column;gap:14px"></div>
</section>

<!-- Round -->
<section id="game" class="hide" style="display:flex;flex-direction:column;gap:16px">
  <div class="top"><button class="back" id="back">رجوع</button><span class="stars" id="rstars">⭐ 0</span></div>
  <div class="dots" id="dots"></div>
  <div class="word">
    <button class="say" id="say" aria-label="استمع إلى الكلمة">🔊</button>
    <div class="bubble" id="msg">اضغط على السماعة، ثم اختر الصورة الصحيحة</div>
  </div>
  <div class="opts" id="opts"></div>
</section>

<!-- Board -->
<section id="board" class="hide" style="display:flex;flex-direction:column;gap:14px">
  <div class="top"><button class="back" id="bback">رجوع</button><h1>لوحة الحروف</h1></div>
  <div class="row"><span class="stars"><span style="font-size:1.8rem;font-weight:800">A</span> كبير</span><span class="stars"><span style="font-size:1rem;font-weight:800">a</span> صغير</span></div>
  <div class="board" id="bgrid"></div>
  <button class="btn" id="bplay" aria-label="تشغيل الحروف بالترتيب"><svg width="34" height="34" viewBox="0 0 24 24" style="display:block" aria-hidden="true"><polygon points="8,5 20,12 8,19" fill="#3a2a1a"/></svg></button>
</section>

<!-- Study -->
<section id="study" class="hide" style="display:flex;flex-direction:column;gap:14px">
  <div class="top"><button class="back" id="sback">اللوحة</button></div>
  <div class="bubble center">
    <div class="cases"><div class="cbox up"><small>الحرف الكبير</small><b id="sup"></b></div><div class="cbox lo"><small>الحرف الصغير</small><b id="slo"></b></div></div>
    <div style="font-size:5rem;line-height:1.2" id="semoji"></div>
    <div class="big" id="sword"></div>
    <div id="sar" style="font-size:1.4rem"></div>
  </div>
  <div class="row"><button class="back" id="sprev">السابق</button><button class="say" id="ssay" style="width:90px;height:90px;font-size:2.4rem" aria-label="استمع">🔊</button><button class="back" id="snext">التالي</button></div>
  <button class="btn" id="strace">تتبّع الحرف ✍️</button>
</section>

<!-- Trace -->
<section id="trace" class="hide" style="display:flex;flex-direction:column;gap:12px">
  <div class="top"><button class="back" id="tback">رجوع</button><span class="stars" id="tinfo"></span></div>
  <div class="bubble" id="tmsg"></div>
  <div class="pad"><canvas id="g" width="360" height="360"></canvas><canvas id="cv" width="360" height="360"></canvas></div>
  <div class="row"><button class="back" id="tprev">السابق</button><button class="back" id="tsay" aria-label="استمع">🔊</button><button class="back" id="tcase">كبير / صغير</button><button class="back" id="tclr">امسح</button><button class="btn" id="tnext">التالي</button></div>
</section>

<!-- End -->
<section id="end" class="hide" style="display:flex;flex-direction:column;gap:16px;align-items:center">
  <div class="mascot">🎉🐪🎉</div>
  <h1 class="center">أحسنت يا بطل!</h1>
  <div class="bubble" id="endmsg"></div>
  <button class="btn" id="again">العب مرة أخرى</button>
  <button class="back" id="home2">القائمة الرئيسية</button>
</section>
</main>

 {id:'colors',ar:'الألوان',ic:'🎨',items:[['red','أحمر','#e63946'],['blue','أزرق','#1d6fe0'],['yellow','أصفر','#ffd60a'],['green','أخضر','#2fb344'],['orange','برتقالي','#fb8500'],['purple','بنفسجي','#8e44ad'],['pink','وردي','#ff8fb8'],['black','أسود','#1b1b1b']]},
 {id:'numbers',ar:'الأرقام',ic:'🔢',items:[['one','واحد','1️⃣'],['two','اثنان','2️⃣'],['three','ثلاثة','3️⃣'],['four','أربعة','4️⃣'],['five','خمسة','5️⃣'],['six','ستة','6️⃣'],['seven','سبعة','7️⃣'],['eight','ثمانية','8️⃣'],['nine','تسعة','9️⃣'],['ten','عشرة','🔟']]},
 {id:'food',ar:'الطعام',ic:'🍎',items:[['apple','تفاحة','🍎'],['banana','موزة','🍌'],['dates','تمر','🌴'],['milk','حليب','🥛'],['bread','خبز','🍞'],['tea','شاي','🍵'],['egg','بيضة','🥚'],['water','ماء','💧']]}
];
const $=id=>document.getElementById(id);
const ROUND=5;
let prog={};
try{prog=JSON.parse(localStorage.getItem('jammool')||'{}')}catch(e){}
function save(){try{localStorage.setItem('jammool',JSON.stringify(prog))}catch(e){}}
const known=c=>(prog[c.id]||[]).length;

function show(id){['home','game','end','trace','board','study'].forEach(s=>$(s).classList.toggle('hide',s!==id))}

const PR=[['mmtaz','ممتاز'],['batal','بطل'],['ra2e3','رائع'],['barak','بارك الله فيك'],['a7sabnt','أحسنت']];
let lastPr=-1;
function bubbles(el,t){
  const r=el.getBoundingClientRect(),ws=t.split(' ');
  const cx=Math.min(Math.max(r.left+r.width/2,Math.min(150,innerWidth/2)),innerWidth-Math.min(150,innerWidth/2));
  ws.forEach((w,n)=>{
    const d=document.createElement('div');
    d.className='pb';d.textContent=w;
    d.style.left=(cx+((ws.length-1)/2-n)*88)+'px';
    d.style.top=(r.top-8)+'px';
    d.style.animationDelay=(n*.15)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2600);
  });
}
function praise(el,then){
  let i;do{i=Math.floor(Math.random()*PR.length)}while(i===lastPr);
  lastPr=i;
  bubbles(el,PR[i][1]);
  try{speechSynthesis.cancel()}catch(e){}
  if(curSnd)curSnd.pause();
  const a=curSnd=new Audio(PRAISE[PR[i][0]]);
  a.onended=()=>{if(then)then()};
  a.play().catch(()=>{if(then)then()});
}
let curSnd=null;
function tts(x){try{const u=new SpeechSynthesisUtterance(x);u.lang='en-US';u.rate=.75;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function playSnd(L,then){
  try{speechSynthesis.cancel()}catch(e){}
  if(curSnd)curSnd.pause();
  const w=(LW.find(x=>x[0]===L)||[L,L])[1];
  if(!AUDIO[L]){if(then)then();return}
  const a=curSnd=new Audio(AUDIO[L]);
  a.onended=()=>{if(then)then()};
  a.play().catch(()=>{if(then)then()});
}
function speak(t){
  try{
    speechSynthesis.cancel();
    const a=cat&&cat.items.find(i=>i[0]===t);
    if(cat&&(cat.id==='sounds'||cat.id==='letters')&&AUDIO[t]){playSnd(t);return}
    const u=new SpeechSynthesisUtterance(a&&a[3]||t);
    u.lang='en-US';u.rate=.75;u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
let ac;
function beep(f,d=.15,delay=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.type='triangle';g.gain.value=.12;
    o.connect(g);g.connect(ac.destination);
    o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+d);
  }catch(e){}
}
const win=()=>{beep(523);beep(659,.15,.12);beep(784,.25,.24)};
const lose=()=>beep(200,.25);

function home(){
  show('home');
  let total=0;
  $('cats').innerHTML='';from='home';addBoard();
  CATS.forEach(c=>{
    total+=known(c);
    const b=document.createElement('button');
    b.className='cat';
    b.innerHTML=`<span class="ic">${c.ic}</span><span>${c.ar}<small>عرفتُ ${known(c)} من ${c.items.length} ${c.id==='letters'||c.id==='sounds'?'حرفًا':'كلمات'}</small></span>`;
    b.onclick=()=>start(c);
    $('cats').appendChild(b);
    if(c.id==='sounds')addTrace();
  });
  $('total').textContent='⭐ '+total;
}

let cat,qs,qi,score,answer,locked;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

function start(c){
  cat=c;
  // prefer words the child hasn't learned yet
  const k=prog[c.id]||[];
  const fresh=shuffle(c.items.filter(i=>!k.includes(i[0])));
  const rest=shuffle(c.items.filter(i=>k.includes(i[0])));
  qs=fresh.concat(rest).slice(0,ROUND);
  qi=0;score=0;
  show('game');
  $('rstars').textContent='⭐ 0';
  $('dots').innerHTML=qs.map(()=>'<i></i>').join('');
  ask();
}

function ask(){
  locked=false;
  answer=qs[qi];
  const others=shuffle(cat.items.filter(i=>i[0]!==answer[0])).slice(0,2);
  const opts=shuffle([answer,...others]);
  $('msg').innerHTML=cat.id==='sounds'?`<span class="big">${answer[5]}</span><br>ما الحرف الذي تبدأ به هذه الكلمة؟`:cat.id==='letters'?'أي حرف سمعت؟ اضغط على السماعة':'ما هذه الكلمة؟ اضغط على السماعة';
  $('opts').innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    b.setAttribute('aria-label',o[1]);
    b.innerHTML=o[2].startsWith('#')?`<span class="sw" style="background:${o[2]}"></span>`:o[2].startsWith('L:')?`<span class="lt">${o[2].slice(2,3)} ${o[2].slice(3)}</span>`:o[2];
    b.onclick=()=>pick(b,o);
    $('opts').appendChild(b);
  });
  setTimeout(()=>speak(answer[0]),350);
}

function pick(btn,o){
  if(locked)return;
  if(o[0]===answer[0]){
    locked=true;
    btn.classList.add('ok');
    win();
    score++;
    $('rstars').textContent='⭐ '+score;
    $('dots').children[qi].classList.add('on');
    $('msg').innerHTML=answer[4]?answer[4]+'<br>أحسنت!':`<span class="big">${answer[0]}</span><br>${answer[1]} — أحسنت!`;
    const k=prog[cat.id]=prog[cat.id]||[];
    if(!k.includes(answer[0]))k.push(answer[0]);
    save();
    praise(btn,()=>speak(answer[0]));
    setTimeout(()=>{qi++;qi<qs.length?ask():finish()},3400);
  }else{
    btn.classList.add('no');
    lose();
    $('msg').textContent='حاول مرة أخرى، أنت تستطيع!';
    setTimeout(()=>{btn.classList.remove('no');speak(answer[0])},500);
  }
}

function finish(){
  show('end');
  $('endmsg').textContent=`جمعتَ ${score} نجوم في ${cat.ar}. تعلّمتَ ${known(cat)} من ${cat.items.length} ${cat.id==='letters'||cat.id==='sounds'?'حرفًا':'كلمات'}.`;
}

let from='home',si=0;
function addBoard(){
  const b=document.createElement('button');b.className='cat';
  b.innerHTML='<span class="ic">🔠</span><span>لوحة الحروف<small>اضغط على أي حرف لتتعلّمه</small></span>';
  b.onclick=openBoard;$('cats').appendChild(b);
}
function openBoard(){
  show('board');
  const k=(prog.trace||[]).concat(prog.letters||[]);
  $('bgrid').innerHTML='';
  LW.forEach((x,i)=>{
    const b=document.createElement('button');
    b.innerHTML='<span class="up">'+x[0]+'</span><span class="lo">'+x[0].toLowerCase()+'</span>';b.setAttribute('aria-label',x[0]+' '+x[0].toLowerCase());
    if(k.includes(x[0]))b.className='done';
    b.onclick=()=>openStudy(i);
    $('bgrid').appendChild(b);
  });
}
function openStudy(i){
  cat=CATS[0];stopAll();si=(i+26)%26;from='study';show('study');
  const [L,w,ar,e]=LW[si];
  $('sup').textContent=L;$('slo').textContent=L.toLowerCase();
  $('semoji').textContent=e;$('sword').textContent=w;$('sar').textContent=ar;
  speak(L);
}
const ICON_PLAY='<svg width="34" height="34" viewBox="0 0 24 24" style="display:block" aria-hidden="true"><polygon points="8,5 20,12 8,19" fill="#3a2a1a"/></svg>';
const ICON_STOP='<svg width="34" height="34" viewBox="0 0 24 24" style="display:block" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="#3a2a1a"/></svg>';
let playing=false,pi=0;
function stopAll(){
  playing=false;
  if(curSnd)curSnd.pause();
  [...$('bgrid').children].forEach(b=>b.classList.remove('now'));
  $('bplay').innerHTML=ICON_PLAY;
}
function playNext(){
  if(!playing)return;
  if(pi>=LW.length){stopAll();return}
  const bs=[...$('bgrid').children];
  bs.forEach(b=>b.classList.remove('now'));
  bs[pi].classList.add('now');
  bs[pi].scrollIntoView({block:'nearest',behavior:'smooth'});
  const L=LW[pi][0];pi++;
  playSnd(L,()=>setTimeout(playNext,500));
}
$('bplay').onclick=()=>{
  if(playing){stopAll();return}
  playing=true;pi=0;
  $('bplay').innerHTML=ICON_STOP;
  playNext();
};
$('bback').onclick=()=>{stopAll();home()};
$('sback').onclick=openBoard;
$('sprev').onclick=()=>openStudy(si-1);
$('snext').onclick=()=>openStudy(si+1);
$('ssay').onclick=()=>playSnd(LW[si][0]);
$('strace').onclick=()=>{from='study';openTrace(si)};
let ti=0,lower=false,mask,done=false,drawing=false;
const tcx=()=>$('cv').getContext('2d');
function addTrace(){
  const b=document.createElement('button');b.className='cat';
  b.innerHTML=`<span class="ic">✍️</span><span>تتبّع الحروف<small>كتبتُ ${(prog.trace||[]).length} من 26 حرفًا</small></span>`;
  b.onclick=()=>{from='home';openTrace(0)};$('cats').appendChild(b);
}
function openTrace(i){cat=CATS[0];show('trace');ti=(i+26)%26;setupTrace()}
function setupTrace(){
  done=false;
  const [L,w,ar,e]=LW[ti],ch=lower?L.toLowerCase():L;
  tcx().clearRect(0,0,360,360);
  const g=$('g').getContext('2d');
  g.clearRect(0,0,360,360);
  g.font="800 280px 'Baloo Bhaijaan 2',Arial,sans-serif";
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='rgba(150,130,90,.35)';
  g.fillText(ch,180,190);
  mask=g.getImageData(0,0,360,360).data;
  $('tmsg').innerHTML='ارسم '+(lower?'الحرف الصغير':'الحرف الكبير')+' <span class="big">'+ch+'</span> بإصبعك فوق الشكل الباهت';
  $('tinfo').textContent='⭐ '+(prog.trace||[]).length+' / 26';
  speak(L);
}
function pos(ev){const r=$('cv').getBoundingClientRect();return[(ev.clientX-r.left)*360/r.width,(ev.clientY-r.top)*360/r.height]}
const cvEl=$('cv');
cvEl.addEventListener('pointerdown',ev=>{
  ev.preventDefault();drawing=true;cvEl.setPointerCapture(ev.pointerId);
  const c=tcx(),[x,y]=pos(ev);
  c.lineWidth=26;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#ff6b6b';
  c.beginPath();c.moveTo(x,y);c.lineTo(x+.1,y);c.stroke();
});
cvEl.addEventListener('pointermove',ev=>{
  if(!drawing)return;ev.preventDefault();
  const c=tcx(),[x,y]=pos(ev);c.lineTo(x,y);c.stroke();c.beginPath();c.moveTo(x,y);
});
const endDraw=()=>{if(drawing){drawing=false;checkTrace()}};
cvEl.addEventListener('pointerup',endDraw);
cvEl.addEventListener('pointercancel',endDraw);
function checkTrace(){
  if(done)return;
  const u=tcx().getImageData(0,0,360,360).data;
  let m=0,hit=0,out=0;
  for(let y=0;y<360;y+=6)for(let x=0;x<360;x+=6){
    const i=(y*360+x)*4+3,inM=mask[i]>40,inU=u[i]>0;
    if(inM){m++;if(inU)hit++}else if(inU)out++;
  }
  if(m&&hit/m>=.6&&out<m*1.5){
    done=true;win();
    const [L,w,ar,e]=LW[ti];
    const k=prog.trace=prog.trace||[];
    if(!k.includes(L))k.push(L);
    save();
    $('tinfo').textContent='⭐ '+k.length+' / 26';
    $('tmsg').innerHTML=`<span class="big">${L} ${L.toLowerCase()}</span><br>${w} ${e} — أحسنت!`;
    praise($('cv').parentElement,()=>speak(L));
  }
}
$('tclr').onclick=setupTrace;
$('tprev').onclick=()=>openTrace(ti-1);
$('tnext').onclick=()=>openTrace(ti+1);
$('tsay').onclick=()=>speak(LW[ti][0]);
$('tcase').onclick=()=>{lower=!lower;setupTrace()};
$('tback').onclick=()=>from==='study'?openStudy(ti):home();
$('say').onclick=()=>speak(answer[0]);
$('back').onclick=home;
$('home2').onclick=home;
$('again').onclick=()=>start(cat);
home();
</script>
